# ── General ───────────────────────────────────────────────────────────────────
set-option -g default-shell /bin/zsh
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -s escape-time 0          # no delay on escape key
set -g focus-events on
set -g mouse on

# Start indices at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on    # close window 2 → window 3 becomes 2

# ── Prefix: Ctrl+b (default, kept) ───────────────────────────────────────────

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Splits & windows ──────────────────────────────────────────────────────────
# Open splits/windows in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+arrow to switch panes without prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi keys) ───────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Activity ──────────────────────────────────────────────────────────────────
setw -g monitor-activity on
set -g visual-activity off

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80

# Colours (One Dark palette)
set -g status-style                 'bg=#282c34 fg=#abb2bf'
set -g status-left                  '#[fg=#61afef,bold] #S #[fg=#3e4452]│ '
set -g status-right                 '#[fg=#98c379]#{pane_current_path} #[fg=#3e4452]│ #[fg=#e5c07b]%H:%M #[fg=#abb2bf]%d %b'

setw -g window-status-format        '#[fg=#5c6370] #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-format '#[fg=#61afef,bold] #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-activity-style 'fg=#e5c07b'

set -g pane-border-style            'fg=#3e4452'
set -g pane-active-border-style     'fg=#61afef'

set -g message-style                'bg=#282c34 fg=#e5c07b'
